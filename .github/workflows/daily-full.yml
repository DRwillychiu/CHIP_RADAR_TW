name: 1. Daily Full Crawl (21:17)

# v3.26.1 hotfix (2026-05-10): 自動排程實際延遲 1-2h 不可接受,3 個對策同時上
#   (a) cron 從整點 (0 12) 改成奇怪分鐘 (17 13) → 避開 GitHub 整點塞車,實測延遲 < 5min
#   (b) 加 22:37 TW 兜底排程,主排程被 GitHub 跳過時自動補
#   (c) commit step「沒變動」改 ::notice:: 級別,Actions 頁能一眼分出真跑了 vs 沒跑
# 主爬蟲 - 每個交易日 21:17 TW (兜底 22:37 TW) 執行
# 抓取: 分點 + 三大法人 + 個股行情 + 融資融券 (可能 T-1) + 產業分類
#
# v3.28.0 hotfix (2026-05-12 21:33 觀察):
#   21:17 那次 run 卡 15m21s 在 `git fetch --depth=1`,GitHub Actions runner
#   一次性網路 outage 導致 checkout 緩慢 → 直接 timeout cancel,crawler 根本沒跑。
#   修法: timeout-minutes 15 → 25 (crawler 正常 11min,留 14min 給 checkout +
#         install + git push 的可能延遲)。fetch-concurrent timeout 也加長。

on:
  schedule:
    # 主排程: 台灣時間 21:17 (UTC 13:17) — 避開整點,延遲應 < 5min
    - cron: '17 13 * * 1-5'
    # 兜底排程 1: 台灣時間 22:37 (UTC 14:37) — 主排程被吃掉時補
    # 若主排程已 commit,兜底跑到 git diff --quiet 自動 no-op,零成本
    - cron: '37 14 * * 1-5'
    # v3.30.3 (2026-05-28): 兜底排程 2 台灣時間 23:47 (UTC 15:47)
    #   5/27-5/28 連兩天 21:17 + 22:37 都被 GitHub cron 吃掉,加第三層提高至少跑一次機率。
    #   同樣 git diff --quiet no-op,零成本。heartbeat.yml 00:30 TW 在此之後才檢查。
    - cron: '47 15 * * 1-5'

  workflow_dispatch:
    inputs:
      force:
        description: '強制重抓 (忽略快取)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    # v3.28.0: 15 → 25; v3.32.2: 25 → 45 (81 分點 + master_profile + alliance + signals + DB)
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          # v3.28.0: 顯式設定 timeout 給 git fetch (不然 default 沒有, 卡到死才 abort)
          fetch-depth: 1
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install requests cryptography openpyxl pyyaml

      # v3.31.14: 下載前一天 DB (GitHub Artifact, 90 天保留)
      # 若無前次 artifact → init 空 DB (第一次跑或 artifact 過期)
      - name: Download previous DB
        uses: dawidd6/action-download-artifact@v21
        with:
          name: chip-radar-db
          path: data/
          if_no_artifact_found: warn
          search_artifacts: true
          workflow: daily-full.yml
        continue-on-error: true

      - name: Run full crawler
        env:
          CHIP_RADAR_PASSWORD: ${{ secrets.CHIP_RADAR_PASSWORD }}
          CHIP_RADAR_STAGE: full
        run: |
          echo "🎯 STAGE=full (主爬蟲)"
          python crawler.py
        continue-on-error: true
      
      # v3.70.0 Phase 3.2 落地: rolling backtest + Excel regen
      # 在 crawler 結束後重 bootstrap phase32_backtest.json + 重 regen Excel
      # 這樣今日 Dashboard 的 alpha sub-banner 抓到含今日的新滾動數字
      - name: Update Phase 3.2 rolling backtest + regen Excel
        env:
          CHIP_RADAR_PASSWORD: ${{ secrets.CHIP_RADAR_PASSWORD }}
        run: |
          python scripts/daily_rolling_update.py
        continue-on-error: true

      # v3.71.7: 抓 attstock.tw 處置股清單 (整合到「今日避開」)
      - name: Refresh attstock disposal
        run: |
          python scripts/refresh_attstock_disposal.py
        continue-on-error: true

      # v3.31.14: 上傳更新後的 DB (GitHub Artifact, 90 天保留)
      # DB 不進 git (.gitignore) 但透過 artifact 在 workflow 間傳遞累積
      - name: Upload DB artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chip-radar-db
          path: data/chip_radar_v2.db
          retention-days: 90
          if-no-files-found: warn

      - name: Commit and push data
        id: commit
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add data/

          # v3.26.1: 沒變動改 ::notice:: 級別,Actions 頁顯眼,
          # 能一眼分出「真跑了但資料沒更新」vs「根本沒跑」
          if git diff --staged --quiet; then
            echo "::notice title=No data changes::Crawler ran but data already up to date (likely manual trigger ran first)"
            echo "data_changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "data_changed=true" >> $GITHUB_OUTPUT

          git commit -m "🔒 [FULL] Daily chip data $(TZ=Asia/Taipei date +%Y-%m-%d\ %H:%M)"

          # Push with retry (萬一同時多個 workflow push)
          for i in 1 2 3; do
            if git push; then
              echo "✅ Push success on attempt $i"
              break
            else
              echo "⚠️ Push attempt $i failed, retry..."
              git pull --rebase --strategy-option=theirs || git rebase --abort
              sleep $((i * 5))
            fi
          done

      # v3.67.2 Phase 2.7: 萃取手機摘要 + 發送 email
      # 僅當 data 有變動才寄 (避免 no-op 重複寄)
      - name: Extract mobile summary
        if: steps.commit.outputs.data_changed == 'true'
        id: summary
        run: |
          # 抓 latest.xlsx 的「📱 手機摘要」sheet → 純文字
          SUMMARY=$(python scripts/extract_mobile_summary_text.py)
          # 也萃取 trade_date 給 subject 用
          TRADE_DATE=$(python -c "
          import json
          with open('data/index.json', 'r', encoding='utf-8') as f:
              d = json.load(f)
          v = d.get('latest', '')
          print(f'{v[:4]}/{v[4:6]}/{v[6:8]}' if len(v)==8 else v)
          ")
          # 寫進 GITHUB_OUTPUT (multi-line 用 heredoc 形式)
          {
            echo "summary<<MOBILE_EOF"
            echo "$SUMMARY"
            echo "MOBILE_EOF"
            echo "trade_date=$TRADE_DATE"
          } >> $GITHUB_OUTPUT

      - name: Send daily summary email
        if: steps.commit.outputs.data_changed == 'true'
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: willychiu77761@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "📋 Chip Radar · ${{ steps.summary.outputs.trade_date }} 摘要"
          body: ${{ steps.summary.outputs.summary }}
          to: willychiu77761@gmail.com
          from: Chip Radar Bot <willychiu77761@gmail.com>
          attachments: data/reports/latest.xlsx
