name: 1. Daily Full Crawl (21:17)

# v3.26.1 hotfix (2026-05-10): 自動排程實際延遲 1-2h 不可接受,3 個對策同時上
#   (a) cron 從整點 (0 12) 改成奇怪分鐘 (17 13) → 避開 GitHub 整點塞車,實測延遲 < 5min
#   (b) 加 22:37 TW 兜底排程,主排程被 GitHub 跳過時自動補
#   (c) commit step「沒變動」改 ::notice:: 級別,Actions 頁能一眼分出真跑了 vs 沒跑
# 主爬蟲 - 每個交易日 21:17 TW (兜底 22:37 TW) 執行
# 抓取: 分點 + 三大法人 + 個股行情 + 融資融券 (可能 T-1) + 產業分類
#
# v3.28.0 hotfix (2026-05-12 21:33 觀察):
#   21:17 那次 run 卡 15m21s 在 `git fetch --depth=1`,GitHub Actions runner
#   一次性網路 outage 導致 checkout 緩慢 → 直接 timeout cancel,crawler 根本沒跑。
#   修法: timeout-minutes 15 → 25 (crawler 正常 11min,留 14min 給 checkout +
#         install + git push 的可能延遲)。fetch-concurrent timeout 也加長。

on:
  schedule:
    # 主排程: 台灣時間 21:17 (UTC 13:17) — 避開整點,延遲應 < 5min
    - cron: '17 13 * * 1-5'
    # 兜底排程 1: 台灣時間 22:37 (UTC 14:37) — 主排程被吃掉時補
    # 若主排程已 commit,兜底跑到 git diff --quiet 自動 no-op,零成本
    - cron: '37 14 * * 1-5'
    # v3.30.3 (2026-05-28): 兜底排程 2 台灣時間 23:47 (UTC 15:47)
    #   5/27-5/28 連兩天 21:17 + 22:37 都被 GitHub cron 吃掉,加第三層提高至少跑一次機率。
    #   同樣 git diff --quiet no-op,零成本。heartbeat.yml 00:30 TW 在此之後才檢查。
    - cron: '47 15 * * 1-5'

  workflow_dispatch:
    inputs:
      force:
        description: '強制重抓 (忽略快取)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    # v3.28.0: 15 → 25; v3.32.2: 25 → 45 (81 分點 + master_profile + alliance + signals + DB)
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          # v3.28.0: 顯式設定 timeout 給 git fetch (不然 default 沒有, 卡到死才 abort)
          fetch-depth: 1
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install requests cryptography openpyxl pyyaml

      # v3.31.14: 下載前一天 DB (GitHub Artifact, 90 天保留)
      # 若無前次 artifact → init 空 DB (第一次跑或 artifact 過期)
      - name: Download previous DB
        uses: dawidd6/action-download-artifact@v21
        with:
          name: chip-radar-db
          path: data/
          if_no_artifact_found: warn
          search_artifacts: true
          workflow: daily-full.yml
        continue-on-error: true

      # v3.55.0: 記錄「跑之前」latest.json 的 trade_date。
      #   本 workflow 有 21:17 / 22:37 / 23:47 三層兜底,每層都完整跑一次 crawler。
      #   若主排程已成功,兜底這次的 trade_date 會跟舊檔相同 → alerts 據此跳過
      #   Telegram 推播,否則同一天會收到 3 則一樣的訊息。
      #   trade_date 在 latest.json 的明文外層,不需要 CHIP_RADAR_PASSWORD。
      - name: Record previous trade date
        id: prev
        run: |
          PREV=$(python -c "import json,sys;print(json.load(open('data/latest.json')).get('trade_date',''))" 2>/dev/null || echo "")
          echo "trade_date=$PREV" >> "$GITHUB_OUTPUT"
          echo "::notice title=Previous trade_date::${PREV:-<none>}"

      - name: Run full crawler
        id: crawl
        env:
          CHIP_RADAR_PASSWORD: ${{ secrets.CHIP_RADAR_PASSWORD }}
          CHIP_RADAR_STAGE: full
          # v3.55.0: Telegram 每日推播 (執行狀態 + 籌碼摘要 + 警報)。
          #   兩個 secret 缺任一 → alerts.send_telegram 自動走 test mode 只 print,
          #   不會讓 crawler 失敗。跟 GitHub 既有的 email/issue 通知並行,不取代。
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHIP_RADAR_PREV_TRADE_DATE: ${{ steps.prev.outputs.trade_date }}
        run: |
          echo "🎯 STAGE=full (主爬蟲)"
          python crawler.py
        continue-on-error: true

      # v3.55.0: crawler 掛掉時的兜底推播。
      #   crawler 正常跑完 → 內部 alerts 已推 digest,這步 skip
      #   crawler crash / timeout / checkout 失敗 → 內部推不到,由這步補
      #   → 兩條路互斥,永遠恰好一則,不會重複也不會漏。
      - name: Notify Telegram on crawler failure
        if: always() && steps.crawl.outcome != 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OUTCOME: ${{ steps.crawl.outcome }}
          SCHEDULE: ${{ github.event.schedule }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # secrets 不能用在 if: 條件, 只能在這裡擋
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::notice::Telegram secrets 未設, 跳過失敗推播"
            exit 0
          fi

          NOW="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          # 標示是哪一層排程觸發的 — 主排程失敗才嚴重, 兜底失敗時資料可能已由主排程更新
          WHICH="${SCHEDULE:-手動觸發}"

          # 用 printf 組多行 — 字面換行會頂到 column 0, 直接截斷 YAML 的 run: | block
          TEXT=$(printf '🚨 <b>Chip Radar</b> · %s TW\n\n❌ Daily Full Crawl 失敗\ncrawler 未正常結束 (outcome: %s)\n觸發排程: %s UTC\n\n<a href="%s">開啟 Actions log</a>' \
            "$NOW" "${OUTCOME:-unknown}" "$WHICH" "$RUN_URL")

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            -o /dev/null
          echo "::notice::已推 Telegram 失敗通知"
      
      # v3.31.14: 上傳更新後的 DB (GitHub Artifact, 90 天保留)
      # DB 不進 git (.gitignore) 但透過 artifact 在 workflow 間傳遞累積
      - name: Upload DB artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chip-radar-db
          path: data/chip_radar_v2.db
          retention-days: 90
          if-no-files-found: warn

      - name: Commit and push data
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add data/

          # v3.26.1: 沒變動改 ::notice:: 級別,Actions 頁顯眼,
          # 能一眼分出「真跑了但資料沒更新」vs「根本沒跑」
          if git diff --staged --quiet; then
            echo "::notice title=No data changes::Crawler ran but data already up to date (likely manual trigger ran first)"
            exit 0
          fi
          
          git commit -m "🔒 [FULL] Daily chip data $(TZ=Asia/Taipei date +%Y-%m-%d\ %H:%M)"
          
          # Push with retry (萬一同時多個 workflow push)
          for i in 1 2 3; do
            if git push; then
              echo "✅ Push success on attempt $i"
              break
            else
              echo "⚠️ Push attempt $i failed, retry..."
              git pull --rebase --strategy-option=theirs || git rebase --abort
              sleep $((i * 5))
            fi
          done
