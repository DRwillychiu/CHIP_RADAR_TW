name: 1. Daily Full Crawl (21:17)

# v3.26.1 hotfix (2026-05-10): 自動排程實際延遲 1-2h 不可接受,3 個對策同時上
#   (a) cron 從整點 (0 12) 改成奇怪分鐘 (17 13) → 避開 GitHub 整點塞車,實測延遲 < 5min
#   (b) 加 22:37 TW 兜底排程,主排程被 GitHub 跳過時自動補
#   (c) commit step「沒變動」改 ::notice:: 級別,Actions 頁能一眼分出真跑了 vs 沒跑
# 主爬蟲 - 每個交易日 21:17 TW (兜底 22:37 TW) 執行
# 抓取: 分點 + 三大法人 + 個股行情 + 融資融券 (可能 T-1) + 產業分類
#
# v3.28.0 hotfix (2026-05-12 21:33 觀察):
#   21:17 那次 run 卡 15m21s 在 `git fetch --depth=1`,GitHub Actions runner
#   一次性網路 outage 導致 checkout 緩慢 → 直接 timeout cancel,crawler 根本沒跑。
#   修法: timeout-minutes 15 → 25 (crawler 正常 11min,留 14min 給 checkout +
#         install + git push 的可能延遲)。fetch-concurrent timeout 也加長。

on:
  schedule:
    # 主排程: 台灣時間 21:17 (UTC 13:17) — 避開整點,延遲應 < 5min
    - cron: '17 13 * * 1-5'
    # 兜底排程 1: 台灣時間 22:37 (UTC 14:37) — 主排程被吃掉時補
    # v3.80.22: 這些 schedule 實際 02:00-06:00 才到,每次都會 commit (時間戳);
    #   只有日表內容和上一輪不同才寄信 (scripts/mail_round.py)
    - cron: '37 14 * * 1-5'
    # v3.30.3 (2026-05-28): 兜底排程 2 台灣時間 23:47 (UTC 15:47)
    #   5/27-5/28 連兩天 21:17 + 22:37 都被 GitHub cron 吃掉,加第三層提高至少跑一次機率。
    #   heartbeat.yml 00:30 TW 在此之後才檢查。
    - cron: '47 15 * * 1-5'

  # v3.80.19 dev environment: a push to `dev` runs this whole workflow as a TEST
  # run (see TEST_RUN below) with dev's code on main's latest data.
  push:
    branches: [dev]

  workflow_dispatch:
    inputs:
      force:
        description: '強制重抓 (忽略快取)'
        required: false
        default: 'false'
      # v3.80.19: TEST run = same steps, but nothing is written back (no data
      # commit, no DB artifact, no Issues); mail subject/body and the attached
      # Excel are labelled TEST. Any ref other than main is always a TEST run.
      test_run:
        description: 'TEST run (no commit, labelled mail)'
        required: false
        default: 'false'

permissions:
  contents: write

# v3.80.5: 同一時間只允許一個 daily-full 在跑 (後到的排隊, 不取消正在跑的).
# 2026-10-01 稽核: 本機 Task Scheduler 的 21:17/22:37 dispatch 與 GitHub 延遲到
# 01:00-04:00 的 schedule run 常常重疊. 兩個 run 各自 checkout 舊版 → 各自寫
# stock_history.json → push 衝突時 `git pull --rebase -X theirs` 讓後推的一方
# 整段覆蓋前者. v3.79.5 的 14 天大盤回補就是這樣在 13 分鐘後被蓋掉的.
# v3.80.19: TEST runs get their own group, so they never queue behind, delay or
# cancel a production run (GitHub cancels the older *pending* run of a group).
concurrency:
  group: ${{ (github.ref != 'refs/heads/main' || inputs.test_run == 'true') && 'daily-full-test' || 'daily-full-crawl' }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
      session: ${{ steps.gate.outputs.session }}
    steps:
      - name: Checkout (gate files only)
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            scripts/trading_gate.py
            src
            data/twse_holidays.json
            data/latest.json
          sparse-checkout-cone-mode: false
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Trading-day gate
        id: gate
        run: python scripts/trading_gate.py --kind evening --event "${{ github.event_name }}" --schedule "${{ github.event.schedule }}"

  crawl:
    needs: gate
    # fail-open: skip only when the gate ran and said no; a crashed gate must not
    # silently cancel a trading-day run
    if: ${{ !cancelled() && (needs.gate.result != 'success' || needs.gate.outputs.run == 'true') }}
    runs-on: ubuntu-24.04
    # v3.28.0: 15 → 25; v3.32.2: 25 → 45 (81 分點 + master_profile + alliance + signals + DB)
    # v3.80.8: 45 → 75. 2026-10-01 富邦整晚偏慢: 21:17 跑 42.0 分 (6 分點逾時各耗 ~80s),
    #   22:37 跑到 45.6 分被砍 — 分點抓完、自我修復也成功了, 但後處理沒跑完,
    #   **被取消的 run 什麼都不會 commit**, 是最糟的結局. 平常 20~25 分,
    #   75 分留給富邦偏慢 + v3.80.6 同輪補抓 (失敗分點 × ~30-80s) 的空間.
    #   concurrency 已序列化, 拉長不會造成與下一個排程重疊寫入.
    timeout-minutes: 75
    # v3.80.15: issues: write so the alert steps below can open GitHub Issues
    # (a job that sets permissions gets none it does not list)
    permissions:
      contents: write
      issues: write
    env:
      # v3.80.19: 'true' for every run not on main (dev pushes) and for a manual
      # run with test_run=true; scheduled runs are on main -> 'false'
      TEST_RUN: ${{ github.ref != 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.test_run == 'true') }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          # v3.28.0: 顯式設定 timeout 給 git fetch (不然 default 沒有, 卡到死才 abort)
          fetch-depth: 1

      # v3.80.19: dev's data/ may be days old (bot data commits land on main
      # only) -> a TEST run from another branch uses main's latest data/ with
      # its own code. Nothing of it is ever pushed back.
      - name: Test run - use main's latest data
        if: env.TEST_RUN == 'true' && github.ref != 'refs/heads/main'
        run: |
          git fetch --depth=1 origin main
          git checkout FETCH_HEAD -- data/
          echo "data/ taken from main $(git rev-parse --short FETCH_HEAD)"
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install requests cryptography openpyxl pyyaml

      # v3.31.14: 下載前一天 DB (GitHub Artifact, 90 天保留)
      # 若無前次 artifact → init 空 DB (第一次跑或 artifact 過期)
      - name: Download previous DB
        uses: dawidd6/action-download-artifact@v21
        with:
          name: chip-radar-db
          path: data/
          if_no_artifact_found: warn
          search_artifacts: true
          workflow: daily-full.yml
        continue-on-error: true

      # v3.55.0: 記錄「跑之前」latest.json 的 trade_date。
      #   本 workflow 有 21:17 / 22:37 / 23:47 三層兜底,每層都完整跑一次 crawler。
      #   若主排程已成功,兜底這次的 trade_date 會跟舊檔相同 → alerts 據此跳過
      #   Telegram 推播,否則同一天會收到 3 則一樣的訊息。
      #   trade_date 在 latest.json 的明文外層,不需要 CHIP_RADAR_PASSWORD。
      - name: Record previous trade date
        id: prev
        run: |
          PREV=$(python -c "import json,sys;print(json.load(open('data/latest.json')).get('trade_date',''))" 2>/dev/null || echo "")
          echo "trade_date=$PREV" >> "$GITHUB_OUTPUT"
          echo "::notice title=Previous trade_date::${PREV:-<none>}"

      - name: Run full crawler
        id: crawl
        env:
          CHIP_RADAR_PASSWORD: ${{ secrets.CHIP_RADAR_PASSWORD }}
          CHIP_RADAR_STAGE: full
          # v3.55.0: Telegram 每日推播 (執行狀態 + 籌碼摘要 + 警報)。
          #   兩個 secret 缺任一 → alerts.send_telegram 自動走 test mode 只 print,
          #   不會讓 crawler 失敗。跟 GitHub 既有的 email/issue 通知並行,不取代。
          #   v3.80.19: a TEST run gets no Telegram secrets -> alerts only print
          TELEGRAM_BOT_TOKEN: ${{ env.TEST_RUN != 'true' && secrets.TELEGRAM_BOT_TOKEN || '' }}
          TELEGRAM_CHAT_ID: ${{ env.TEST_RUN != 'true' && secrets.TELEGRAM_CHAT_ID || '' }}
          CHIP_RADAR_PREV_TRADE_DATE: ${{ steps.prev.outputs.trade_date }}
        run: |
          echo "🎯 STAGE=full (主爬蟲)"
          python crawler.py
        continue-on-error: true

      # v3.55.0: crawler 掛掉時的兜底推播。
      #   crawler 正常跑完 → 內部 alerts 已推 digest,這步 skip
      #   crawler crash / timeout / checkout 失敗 → 內部推不到,由這步補
      #   → 兩條路互斥,永遠恰好一則,不會重複也不會漏。
      - name: Notify Telegram on crawler failure
        # v3.80.19: never from a TEST run
        if: always() && steps.crawl.outcome != 'success' && env.TEST_RUN != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OUTCOME: ${{ steps.crawl.outcome }}
          SCHEDULE: ${{ github.event.schedule }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # secrets 不能用在 if: 條件, 只能在這裡擋
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::notice::Telegram secrets 未設, 跳過失敗推播"
            exit 0
          fi

          NOW="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          # 標示是哪一層排程觸發的 — 主排程失敗才嚴重, 兜底失敗時資料可能已由主排程更新
          WHICH="${SCHEDULE:-手動觸發}"

          # 用 printf 組多行 — 字面換行會頂到 column 0, 直接截斷 YAML 的 run: | block
          TEXT=$(printf '🚨 <b>Chip Radar</b> · %s TW\n\n❌ Daily Full Crawl 失敗\ncrawler 未正常結束 (outcome: %s)\n觸發排程: %s UTC\n\n<a href="%s">開啟 Actions log</a>' \
            "$NOW" "${OUTCOME:-unknown}" "$WHICH" "$RUN_URL")

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            -o /dev/null
          echo "::notice::已推 Telegram 失敗通知"
      
      # v3.71.7: 抓 attstock.tw 處置股清單 (整合到「今日避開」)
      # v3.80.14: 移到 Excel 重建之前 — 原本排在兩次產表之後, 當輪報表/Email
      #   用的永遠是上一輪抓到的清單
      - name: Refresh attstock disposal
        run: |
          python scripts/refresh_attstock_disposal.py
        continue-on-error: true

      # v3.70.0 Phase 3.2 落地: rolling backtest + Excel regen
      # 在 crawler 結束後重 bootstrap phase32_backtest.json + 重 regen Excel
      # 這樣今日 Dashboard 的 alpha sub-banner 抓到含今日的新滾動數字
      - name: Update Phase 3.2 rolling backtest + regen Excel
        env:
          CHIP_RADAR_PASSWORD: ${{ secrets.CHIP_RADAR_PASSWORD }}
        run: |
          python scripts/daily_rolling_update.py
        continue-on-error: true

      # v3.80.15: every row of the newest day sheet vs the Fubon source pages
      # (date pinned) + official closes -> data/audit/source_audit_latest.json
      # (gitignored). Own ~8 min budget; never fails or blocks the run.
      - name: Source audit (Excel vs Fubon pages)
        id: audit
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python scripts/source_audit.py

      # v3.31.14: 上傳更新後的 DB (GitHub Artifact, 90 天保留)
      # DB 不進 git (.gitignore) 但透過 artifact 在 workflow 間傳遞累積
      - name: Upload DB artifact
        if: always() && env.TEST_RUN != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: chip-radar-db
          path: data/chip_radar_v2.db
          retention-days: 90
          if-no-files-found: warn

      # v3.80.19 TEST run only: label a copy of the Excel, keep it + the mail
      # text as a 7-day run artifact
      - name: Test run - label outputs
        if: env.TEST_RUN == 'true'
        run: |
          PYTHONIOENCODING=utf-8 python - <<'PY'
          import openpyxl
          TAG = '🧪【測試階段・非正式】'
          wb = openpyxl.load_workbook('data/reports/latest.xlsx')
          days = sorted(n for n in wb.sheetnames if len(n) == 8 and n.isdigit())
          targets = [wb.worksheets[0]] + ([wb[days[-1]]] if days else [])
          for ws in targets:
              ws.sheet_properties.tabColor = 'FFFF0000'
              cells = [c for row in ws.iter_rows(min_row=1, max_row=3, max_col=8)
                       for c in row if isinstance(c.value, str) and c.value.strip()]
              if cells:
                  cells[0].value = TAG + cells[0].value
                  print('labelled', ws.title, cells[0].coordinate)
          wb.save('data/reports/TEST_chip_radar_latest.xlsx')
          print('sheets:', wb.sheetnames)
          PY
      - name: Test run - upload outputs
        if: env.TEST_RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-run-output
          path: |
            data/reports/TEST_chip_radar_latest.xlsx
            data/reports/mobile_summary.txt
          retention-days: 7
          if-no-files-found: warn

      # v3.80.22 owner 2026-10-07: 21:17 / 22:37 (local scheduler dispatch) always
      # mail; schedule re-runs mail only if the newest day sheet changed. Subject +
      # first body line = round number + change vs the previous round. State file
      # data/reports/mail_rounds.json goes into the data commit below.
      - name: Mail round
        id: round
        continue-on-error: true
        run: |
          python scripts/mail_round.py --event "${{ github.event_name }}" ${{ env.TEST_RUN == 'true' && '--test' || '' }}

      - name: Commit and push data
        id: commit
        run: |
          # v3.80.19: a TEST run never commits; it still mails (labelled)
          if [ "${{ env.TEST_RUN }}" = "true" ]; then
            echo "::notice title=TEST RUN::Test run - data NOT committed, DB artifact NOT uploaded"
            echo "data_changed=false" >> $GITHUB_OUTPUT
            echo "send_mail=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add data/

          # v3.26.1: 沒變動改 ::notice:: 級別,Actions 頁顯眼,
          # 能一眼分出「真跑了但資料沒更新」vs「根本沒跑」
          if git diff --staged --quiet; then
            echo "::notice title=No data changes::Crawler ran but data already up to date (likely manual trigger ran first)"
            echo "data_changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "data_changed=true" >> $GITHUB_OUTPUT
          # v3.80.22: mail_round decides; empty (step failed) -> mail anyway
          SEND="${{ steps.round.outputs.send }}"
          echo "send_mail=${SEND:-true}" >> $GITHUB_OUTPUT

          git commit -m "🔒 [FULL] Daily chip data $(TZ=Asia/Taipei date +%Y-%m-%d\ %H:%M)"

          # Push with retry (萬一同時多個 workflow push)
          for i in 1 2 3; do
            if git push; then
              echo "✅ Push success on attempt $i"
              break
            else
              echo "⚠️ Push attempt $i failed, retry..."
              git pull --rebase --strategy-option=theirs || git rebase --abort
              sleep $((i * 5))
            fi
          done

      # v3.67.2 Phase 2.7: 萃取手機摘要 + 發送 email
      - name: Extract mobile summary
        # v3.80.19 / v3.80.22: send_mail = mail_round verdict (production) or any TEST run
        if: steps.commit.outputs.send_mail == 'true'
        id: summary
        run: |
          # v3.80.15: one-line source audit verdict goes first in the mail body
          AUDIT_LINE=$(python scripts/source_audit.py --email-line || true)
          [ -n "$AUDIT_LINE" ] || AUDIT_LINE="⚠️ 來源比對：今天沒有跑完"
          # v3.80.22: round line first, then the audit verdict
          ROUND_LINE="${{ steps.round.outputs.line }}"
          [ -z "$ROUND_LINE" ] || AUDIT_LINE="$ROUND_LINE
          $AUDIT_LINE"
          if [ "${{ env.TEST_RUN }}" = "true" ]; then
            AUDIT_LINE="🧪【測試階段】這封是測試信，不是正式日報（${{ github.ref_name }}）
          資料沒有寫回雲端；正式排程照常跑、照常寄信
          ────────────
          $AUDIT_LINE"
          fi
          # v3.80.13: 讀 data/reports/mobile_summary.txt (手機摘要已不是 Excel 頁籤)
          SUMMARY=$(python scripts/extract_mobile_summary_text.py)
          # 也萃取 trade_date 給 subject 用
          TRADE_DATE=$(python -c "
          import json
          with open('data/index.json', 'r', encoding='utf-8') as f:
              d = json.load(f)
          v = d.get('latest', '')
          print(f'{v[:4]}/{v[4:6]}/{v[6:8]}' if len(v)==8 else v)
          ")
          # 寫進 GITHUB_OUTPUT (multi-line 用 heredoc 形式)
          {
            echo "summary<<MOBILE_EOF"
            echo "$AUDIT_LINE"
            echo ""
            echo "$SUMMARY"
            echo "MOBILE_EOF"
            echo "trade_date=$TRADE_DATE"
          } >> $GITHUB_OUTPUT

      - name: Send daily summary email
        id: send_email
        if: steps.commit.outputs.send_mail == 'true'
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: willychiu77761@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "${{ env.TEST_RUN == 'true' && '🧪【測試】' || '' }}📋 Chip Radar · ${{ steps.summary.outputs.trade_date }} 摘要${{ steps.round.outputs.tag }}"
          body: ${{ steps.summary.outputs.summary }}
          to: willychiu77761@gmail.com
          from: Chip Radar Bot <willychiu77761@gmail.com>
          attachments: ${{ env.TEST_RUN == 'true' && 'data/reports/TEST_chip_radar_latest.xlsx' || 'data/reports/latest.xlsx' }}

      # v3.71.12 D4: Email 寄送失敗 → 開 GitHub Issue alert
      # GitHub 預設會 email notification 你, 等於 fallback channel
      - name: Email failure alert (GitHub Issue)
        if: failure() && steps.commit.outputs.data_changed == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const date = '${{ steps.summary.outputs.trade_date }}' || new Date().toISOString().slice(0,10);
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Daily email 寄送失敗 ${date}`,
              labels: ['email-failure', 'production-alert'],
              body: [
                '## Daily summary email 寄送失敗',
                '',
                `**日期**: ${date}`,
                `**Workflow run**: ${runUrl}`,
                '',
                '### 可能原因',
                '- GMAIL_APP_PASSWORD secret 過期 (Google 帳號改密碼會 invalidate)',
                '- SMTP 連線問題 (smtp.gmail.com:465 短暫 fail)',
                '- latest.xlsx 不存在 / 過大 (attachment fail)',
                '',
                '### 處置 SOP',
                '1. 看 workflow log 確認 fail 步驟',
                '2. 若 password 問題: 到 Google 帳戶 → App passwords 重發 → 更新 GitHub secret',
                '3. 若 SMTP 暫時性: 等下次主排程 (22:37 兜底 / 23:47 兜底)',
                '4. 修好後手動 trigger: `gh workflow run daily-full.yml`',
                '',
                '解決後 close 此 issue.'
              ].join('\n'),
            });

      # v3.80.15: source audit found rows that differ from the Fubon pages ->
      # open one GitHub Issue per trade date (skipped while the same title is
      # still open). Last step on purpose: its own failure must not trigger the
      # email-failure alert above, and continue-on-error keeps the run green.
      - name: Source audit mismatch alert (GitHub Issue)
        if: ${{ !cancelled() && steps.audit.outputs.status == 'mismatch' && steps.commit.outputs.data_changed == 'true' }}
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            let a;
            try {
              a = JSON.parse(fs.readFileSync('data/audit/source_audit_latest.json', 'utf8'));
            } catch (e) {
              core.warning(`source audit json unreadable: ${e.message}`);
              return;
            }
            const td = String(a.trade_date || '');
            const date = td.length === 8 ? `${td.slice(0, 4)}-${td.slice(4, 6)}-${td.slice(6, 8)}` : td;
            const n = a.mismatch_total || (a.mismatches || []).length;
            const title = `🚨 來源比對不符 ${date}：${n} 列`;
            const { owner, repo } = context.repo;
            const open = await github.paginate(github.rest.issues.listForRepo,
              { owner, repo, state: 'open', per_page: 100 });
            if (open.some(i => i.title === title)) {
              core.info(`open issue already exists: ${title}`);
              return;
            }
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const pair = v => Array.isArray(v) ? v.join(' / ') : '-';
            const two = (o, a1, a2) => o ? `${o[a1]} / ${o[a2]}` : '-';
            const list = a.mismatches || [];
            const rows = list.map(m => '| ' + [
              m.master, `${m.branch} (${m.bno})`, m.stock,
              two(m.excel, 'buy_lot', 'sell_lot'), two(m.excel, 'buy_wan', 'sell_wan'),
              two(m.expected, 'buy_lot', 'sell_lot'), two(m.expected, 'buy_wan', 'sell_wan'),
              pair((m.source || {}).lots), pair((m.source || {}).amt_k),
              (m.source || {}).close ?? '-', m.reason || '',
            ].join(' | ') + ' |');
            const body = [
              `## 來源比對不符 ${date}`,
              '',
              `Excel 日表 ${a.sheet} 有 **${n}** 列與富邦原始分點頁 (指定日期 ${date}) 不符.`,
              `共比對 ${a.rows} 列: ` + Object.entries(a.verdicts || {}).map(([k, v]) => `${k} ${v}`).join(', '),
              `**Workflow run**: ${runUrl}`,
              '',
              '| 高手 | 分點 | 標的 | Excel 張 買/賣 | Excel 萬 買/賣 | 應為 張 | 應為 萬 | 來源張數頁 | 來源金額頁(仟元) | 收盤 | 原因 |',
              '|---|---|---|---|---|---|---|---|---|---|---|',
              ...rows,
              n > list.length ? `\n(只列前 ${list.length} 列, 共 ${n} 列不符)` : '',
              '',
              '判定規則: src/audit/source_audit.py. 查明並修正後 close 此 issue.',
            ].join('\n');
            try {
              await github.rest.issues.create({ owner, repo, title, body, labels: ['source-audit'] });
            } catch (e) {
              core.warning(`create with label failed (${e.message}); retrying without label`);
              await github.rest.issues.create({ owner, repo, title, body });
            }
