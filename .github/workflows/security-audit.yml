name: 4. Security Audit (Weekly)

# v3.30.1 (2026-05-24) — 專業審視 A.2: Python dependency vulnerability scan
# 每週一上午跑 pip-audit, 發現 CVE 自動 ::error:: 標示
# Trigger: 週一 03:00 TW (避開市場時間), 或 manual dispatch

on:
  schedule:
    - cron: '0 19 * * 0'   # 週日 19:00 UTC = 週一 03:00 TW
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install scan tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit safety

      # P0-7 (v3.38.0): 嚴格化 — 移除 || true 和 continue-on-error
      # CVE / vulnerability 必 fail workflow, 防無感放行進 main
      - name: Audit requirements.txt (strict)
        run: |
          echo "::group::pip-audit (requirements.txt strict)"
          pip-audit --requirement requirements.txt --format markdown
          echo "::endgroup::"

      - name: Audit transitive (full env, strict)
        run: |
          # 安裝釘版 main deps (requirements.txt 已釘上下界)
          pip install -r requirements.txt
          echo "::group::pip-audit (full transitive strict)"
          pip-audit --format markdown
          echo "::endgroup::"

      - name: Safety scan (strict)
        run: |
          echo "::group::safety scan"
          safety check --json
          echo "::endgroup::"
