name: 8. Intraday Settlement First Look (13:35 TW)

# v3.41.0 (2026-06-19, Sprint 4):
# 盤後 5 分鐘抓 TWSE 三大法人 first look
# 不等 21:17 主排程, 提早 8 小時看到當日法人態勢
# v3.80.4: 加交易日開關 gate job, 國定假日/颱風假不再空跑

on:
  schedule:
    # 週一-五 UTC 05:35 = TW 13:35 (盤後 5 分鐘)
    # v3.79.1 修: 原為 '2-6' (TW 週二~週六) → 每週一無盤中回顧, 週六空跑.
    #   UTC 05:35 與 TW 13:35 同日, 故用 1-5 正確對應台股交易日.
    - cron: '35 5 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
      session: ${{ steps.gate.outputs.session }}
    steps:
      - name: Checkout (gate files only)
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            scripts/trading_gate.py
            src
            data/twse_holidays.json
            data/latest.json
          sparse-checkout-cone-mode: false
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Trading-day gate
        id: gate
        run: python scripts/trading_gate.py --kind day --event "${{ github.event_name }}" --schedule "${{ github.event.schedule }}"

  settlement:
    needs: gate
    # fail-open: skip only when the gate ran and said no; a crashed gate must not
    # silently cancel a trading-day run
    if: ${{ !cancelled() && (needs.gate.result != 'success' || needs.gate.outputs.run == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch intraday settlement
        run: python intraday_settlement.py
        continue-on-error: true   # TWSE 偶爾 lag, 不視為錯誤

      - name: Commit
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add data/intraday_settlement.json

          if git diff --staged --quiet; then
            echo "::notice title=No settlement changes::TWSE 仍是舊資料 (可能尚未公布)"
            exit 0
          fi

          git commit -m "📊 [INTRADAY] First look $(TZ=Asia/Taipei date +%Y-%m-%d\ %H:%M)"

          for i in 1 2 3; do
            if git push; then break
            else git pull --rebase --strategy-option=theirs || git rebase --abort
                 sleep $((i * 5))
            fi
          done
