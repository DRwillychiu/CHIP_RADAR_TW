name: 7. Pre-Market Alert (08:50 TW)

# v3.41.0 (2026-06-19, Sprint 4):
# 盤前快訊 — 讀已存在的 data 檔產出 3 行摘要
#   - 昨日大戶 Top 3 累積買進金額
#   - 新增處置股 + 新差 1 次
#   - 結算日壓力 (D-?)
# 不爬新資料, 純摘要 (秒級完成)
# v3.80.4: 加交易日開關 gate job, 國定假日 (中秋/教師節...) 不再產出盤前簡報

on:
  schedule:
    # 週一-五 UTC 00:50 = TW 08:50 (開盤前 10 分鐘)
    # v3.79.1 修: 原為 '2-6' 且註解寫「週一是台股休市」— 前提錯誤,
    #   台股週一正常開盤 (data/20260914.json 為證). 後果是每週一無盤前簡報,
    #   且週六多跑一次無意義. UTC 1-5 = TW 週一~週五, 正確涵蓋交易日.
    - cron: '50 0 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
      session: ${{ steps.gate.outputs.session }}
    steps:
      - name: Checkout (gate files only)
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            scripts/trading_gate.py
            src
            data/twse_holidays.json
            data/latest.json
          sparse-checkout-cone-mode: false
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Trading-day gate
        id: gate
        run: python scripts/trading_gate.py --kind premarket --event "${{ github.event_name }}" --schedule "${{ github.event.schedule }}"

  brief:
    needs: gate
    # fail-open: skip only when the gate ran and said no; a crashed gate must not
    # silently cancel a trading-day run
    if: ${{ !cancelled() && (needs.gate.result != 'success' || needs.gate.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build pre-market brief
        run: python pre_market_brief.py

      - name: Commit brief
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add data/pre_market_brief.json

          if git diff --staged --quiet; then
            echo "::notice title=No brief changes::Brief already up to date"
            exit 0
          fi

          git commit -m "🌅 [PRE-MARKET] Brief $(TZ=Asia/Taipei date +%Y-%m-%d)"

          for i in 1 2 3; do
            if git push; then break
            else git pull --rebase --strategy-option=theirs || git rebase --abort
                 sleep $((i * 5))
            fi
          done
